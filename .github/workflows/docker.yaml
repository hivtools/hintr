name: Build Docker Image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  TAG_SERVER_GHCR: hivtools/hintr
  TAG_WORKER_GHCR: hivtools/hintr-worker

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: extract_branch
        name: Setup Environment
        shell: bash
        ## Branch names go through env, not ${{ }}, so they can't inject
        ## shell code
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{github.event_name}}" = "pull_request" ];
          then
            LONG_SHA=$PR_SHA
            echo "CI_BRANCH=$HEAD_REF" >> $GITHUB_OUTPUT
          else
            LONG_SHA=${GITHUB_SHA}
            echo "CI_BRANCH=$REF_NAME" >> $GITHUB_OUTPUT
          fi
          echo "CI_SHA=${LONG_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (GitHub Packages)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Naomi
        uses: actions/checkout@v4
        with:
          repository: mrc-ide/naomi
          ## ref: feature-branch
          ## ${{ github.token }} is scoped to the current repository, so we
          ## need to provide our own PAT
          token: ${{ secrets.NAOMI_GH_PAT }}
          path: naomi

      ## Pin naomi to commits so a new naomi commit invalidates the build cache
      - name: Get naomi commits
        id: naomi
        shell: bash
        run: |
          echo "naomi=$(git -C naomi rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "naomi_options=$(git ls-remote https://github.com/mrc-ide/naomi.options HEAD | cut -f1)" >> $GITHUB_OUTPUT

      ## The build stage (naomi install and model fit) is cached in the
      ## registry, so it only rebuilds when naomi-base or naomi change
      - name: Build and push server container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: "./docker/Dockerfile"
          push: true
          build-args: |
            NAOMI_REF=${{ steps.naomi.outputs.naomi }}
            NAOMI_OPTIONS_REF=${{ steps.naomi.outputs.naomi_options }}
          cache-from: type=registry,ref=ghcr.io/${{env.TAG_SERVER_GHCR}}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{env.TAG_SERVER_GHCR}}:buildcache,mode=max,ignore-error=true
          tags: |
            ghcr.io/${{env.TAG_SERVER_GHCR}}:${{steps.extract_branch.outputs.CI_BRANCH}}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}:latest', env.TAG_SERVER_GHCR) || '' }}

      ## Smoke test: catches runtime problems such as missing shared libraries
      ## (e.g. sf failing to load libgdal) which only appear when the
      ## multi-stage build's run image starts up.
      - name: Test server container starts
        shell: bash
        run: |
          IMAGE=ghcr.io/${{env.TAG_SERVER_GHCR}}:${{steps.extract_branch.outputs.CI_BRANCH}}
          docker network create hintr_network
          docker run --rm -d --network=hintr_network --network-alias=redis \
            --name hintr_redis redis
          docker run -d --network=hintr_network -p 8888:8888 \
            -e REDIS_URL=redis://redis:6379 \
            -e USE_MOCK_MODEL=true \
            --name hintr_server $IMAGE
          for attempt in $(seq 30); do
            RESPONSE=$(curl --silent http://localhost:8888 || true)
            if [ "$RESPONSE" == '{"status":"success","errors":null,"data":"Welcome to hintr"}' ]; then
              echo "SUCCESS"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' hintr_server)" != "true" ]; then
              echo "Server container exited early"
              break
            fi
            echo "Attempt $attempt failed, retrying"
            sleep 2
          done
          echo "Server failed to start, container logs:"
          docker logs hintr_server
          exit 1

      ## Same build as the server with a different entrypoint, so everything
      ## comes from the builder's cache
      - name: Build and push worker container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: "./docker/Dockerfile"
          target: worker
          push: true
          build-args: |
            NAOMI_REF=${{ steps.naomi.outputs.naomi }}
            NAOMI_OPTIONS_REF=${{ steps.naomi.outputs.naomi_options }}
          cache-from: type=registry,ref=ghcr.io/${{env.TAG_SERVER_GHCR}}:buildcache
          tags: |
            ghcr.io/${{env.TAG_WORKER_GHCR}}:${{steps.extract_branch.outputs.CI_BRANCH}}
            ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}:latest', env.TAG_WORKER_GHCR) || '' }}
